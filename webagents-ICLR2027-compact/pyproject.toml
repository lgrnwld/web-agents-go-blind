[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "webagents-benchmark"
version = "0.1.0"
description = "Reproducible web-agent runners and exact observation archives"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "browser-use[core] @ git+https://github.com/browser-use/browser-use.git@f0aa3a8bb03779c71a5aa262d389e3bfe6b77cdc",
  "openai==2.16.0",
  "playwright==1.61.0",
  "pydantic>=2.12,<3",
  "pyyaml>=6.0.2,<7",
  "selenium==4.48.0",
  "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
  "pyright>=1.1.408,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.14,<0.15",
]

[project.scripts]
webagent-run = "webagents.cli:main"
webagent-archive = "webagents.archive_cli:main"
webagent-control = "webagents.control.cli:main"
webagent-sweep = "webagents.sweeps.cli:main"
webagent-surprises = "webagents.surprises.cli:main"
webagent-config = "webagents.config_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webagents"]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/.python-version",
  "/README.md",
  "/benchmarks",
  "/evidence",
  "/examples",
  "/future_work_draft.md",
  "/goal.md",
  "/plans",
  "/pyproject.toml",
  "/related_work_draft.md",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: local-browser integration tests",
  "provider: opt-in tests that spend provider credits",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
ignore = ["ASYNC109"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
